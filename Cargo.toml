[package]
name = "otp-actor"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "OTP Actor framework for Tokio with supervision tree and resilient resource actor inspired by Erlang/OTP"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlfredWeirich/otp-actor"
keywords = ["actor", "supervision", "tokio", "cache", "resilience"]
categories = ["asynchronous", "concurrency"]

[features]
default = []
remote = [
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:serde",
    "dep:bincode",
    "dep:tokio-stream",
    "dep:tonic-prost-build",
    "tokio/net",
]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2.0.21"
tracing = "0.1"

# Optional dependencies for gRPC remote actors
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "remote_all_in_one"
path = "examples/remote/all_in_one.rs"
required-features = ["remote"]

[[example]]
name = "remote_server"
path = "examples/remote/server.rs"
required-features = ["remote"]

[[example]]
name = "remote_client"
path = "examples/remote/client.rs"
required-features = ["remote"]

[profile.release]
opt-level = 3
lto = true              # Full cross-crate LTO for maximum inlining
codegen-units = 1        # Single codegen unit = best optimization (slower compile)
strip = true             # Strip debug symbols from binary
panic = "unwind"         # Unwind is required for panic-isolation (JoinError::is_panic / catch_unwind)
overflow-checks = true   # Prevent silent integer wrap-around in release builds
# For target-native optimizations (AVX2, AES-NI, etc.), build with:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
